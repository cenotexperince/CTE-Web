<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CET | Cenotes Experience Tulum</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #073b46 0%, #02191f 45%, #020b0e 100%);
      color: white;
      text-align: center;
      padding: 25px 18px 40px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .brand {
      margin-bottom: 18px;
    }

    .brand h1 {
      font-size: 30px;
      letter-spacing: 5px;
      color: #51f5e7;
      text-shadow:
        0 0 8px rgba(81, 245, 231, .7),
        0 0 20px rgba(0, 187, 255, .35);
    }

    .brand p {
      margin-top: 5px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #d8ffff;
    }

    .video-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding: 7px;
      border-radius: 24px;
      background: linear-gradient(
        145deg,
        #52fff0,
        #0086bb,
        #54e8bc
      );

      box-shadow:
        0 0 22px rgba(41, 238, 225, .28);
    }

    video {
      display: block;
      width: 100%;
      border-radius: 19px;
      background: black;
    }

    .title {
      margin-top: 25px;
      font-size: 22px;
      line-height: 1.25;
    }

    .subtitle {
      margin: 10px auto 23px;
      max-width: 360px;
      color: #cfe9e9;
      font-size: 15px;
      line-height: 1.55;
    }

    .whatsapp-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;

      box-shadow:
        0 8px 24px rgba(37, 211, 102, .25);

      transition: transform .2s ease;
    }

    .whatsapp-btn:active {
      transform: scale(.97);
    }

    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #9fbfc0;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="brand">
      <h1>CET</h1>
      <p>CENOTES EXPERIENCE TULUM</p>
    </section>

    <div class="video-box">
      <video controls playsinline preload="metadata">
        <source src="CTE.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
      </video>
    </div>

    <h2 class="title">
      Descubre una experiencia inolvidable en Tulum 🌴
    </h2>

    <p class="subtitle">
      Cenotes, naturaleza y aventura te esperan.
      Elige tu experiencia y nosotros te ayudamos con tu reservación.
    </p>

    <a
      class="whatsapp-btn"
      href="https://wa.me/5665689052?text=Hola%20me%20interesa%20reservar%20una%20experiencia%20con%20CET"
    >
      💬 Reservar por WhatsApp
    </a>

    <p class="small">
      CET · Cenotes Experience Tulum
    </p>

  </main>

</body>
</html>
